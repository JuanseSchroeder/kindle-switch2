<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Interruptor</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    color: #111111;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .frame {
    box-sizing: border-box;
    width: 100%;
    min-height: 100vh;
    padding: 40px 24px;
    display: block;
    text-align: center;
  }

  .eyebrow {
    font-family: "Courier New", monospace;
    font-size: 18px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #444444;
    margin: 0 0 10px 0;
  }

  .room-label {
    font-size: 42px;
    font-weight: bold;
    margin: 0 0 56px 0;
    border-bottom: 4px solid #111111;
    display: inline-block;
    padding-bottom: 12px;
  }

  /* Placa de interruptor: el elemento distintivo de la página */
  .plate {
    box-sizing: border-box;
    width: 340px;
    margin: 0 auto;
    border: 5px solid #111111;
    padding: 24px;
    background: #f6f6f4;
    cursor: pointer;
  }

  .plate-inner {
    border: 3px solid #111111;
    padding: 40px 14px;
  }

  .switch-track {
    box-sizing: border-box;
    width: 120px;
    height: 226px;
    margin: 0 auto 32px auto;
    border: 5px solid #111111;
    position: relative;
    background: #ffffff;
  }

  .switch-knob {
    box-sizing: border-box;
    position: absolute;
    left: -5px;
    width: 120px;
    height: 113px;
    border: 5px solid #111111;
    background: #111111;
    transition: top 0.15s ease-out;
  }

  /* Estado ON: perilla arriba, rellena de negro (luz = presente) */
  .state-on .switch-knob {
    top: -5px;
    background: #111111;
  }

  /* Estado OFF: perilla abajo, hueca */
  .state-off .switch-knob {
    top: 108px;
    background: #ffffff;
  }

  .status-word {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0 0 6px 0;
  }

  .status-sub {
    font-family: "Courier New", monospace;
    font-size: 16px;
    color: #555555;
    margin: 0;
  }

  .footer-note {
    margin-top: 30px;
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: #777777;
  }

  .error-box {
    display: none;
    margin-top: 20px;
    border: 2px dashed #111111;
    padding: 12px;
    font-family: "Courier New", monospace;
    font-size: 13px;
  }
</style>
</head>
<body>

  <div class="frame">
    <p class="eyebrow">Kindle &mdash; Panel remoto</p>
    <h1 class="room-label">LUZ DEL PATIO</h1>

    <div class="plate" id="plate" onclick="toggleLight()">
      <div class="plate-inner">
        <div class="switch-track state-off" id="switchTrack">
          <div class="switch-knob" id="switchKnob"></div>
        </div>
        <p class="status-word" id="statusWord">CONSULTANDO&hellip;</p>
        <p class="status-sub" id="statusSub">esperando estado</p>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <p class="footer-note">device: switch_1 &middot; via Tuya Cloud</p>
  </div>

<script>
  // Ajustá esta URL a la de tu deploy en Vercel, por ejemplo:
  // var API_URL = "https://tu-proyecto.vercel.app/api/toggle";
  var API_URL = "/api/toggle";

  var isOn = null;
  var busy = false;

  function setUI(on) {
    isOn = on;
    var track = document.getElementById("switchTrack");
    var word = document.getElementById("statusWord");
    var sub = document.getElementById("statusSub");

    if (on) {
      track.className = "switch-track state-on";
      word.innerHTML = "ENCENDIDA";
      sub.innerHTML = "toque para apagar";
    } else {
      track.className = "switch-track state-off";
      word.innerHTML = "APAGADA";
      sub.innerHTML = "toque para encender";
    }
  }

  function showError(msg) {
    var box = document.getElementById("errorBox");
    box.style.display = "block";
    box.innerHTML = "ERROR: " + msg;
  }

  function hideError() {
    document.getElementById("errorBox").style.display = "none";
  }

  function request(action, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", API_URL, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            cb(null, data);
          } catch (e) {
            cb("respuesta inválida del servidor");
          }
        } else {
          cb("servidor respondió " + xhr.status);
        }
      }
    };
    xhr.onerror = function () {
      cb("no se pudo conectar");
    };
    xhr.send(JSON.stringify({ action: action }));
  }

  function refreshStatus() {
    request("status", function (err, data) {
      if (err) {
        showError(err);
        document.getElementById("statusWord").innerHTML = "SIN CONEXIÓN";
        document.getElementById("statusSub").innerHTML = "reintentar";
        return;
      }
      hideError();
      setUI(!!data.on);
    });
  }

  function toggleLight() {
    if (busy) return;
    busy = true;
    document.getElementById("statusWord").innerHTML = "ENVIANDO&hellip;";

    request("toggle", function (err, data) {
      busy = false;
      if (err) {
        showError(err);
        refreshStatus();
        return;
      }
      hideError();
      setUI(!!data.on);
    });
  }

  refreshStatus();
</script>

</body>
</html>
