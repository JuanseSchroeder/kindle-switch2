<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Medicación</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    color: #111111;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .frame {
    box-sizing: border-box;
    width: 100%;
    min-height: 100vh;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .eyebrow {
    font-family: "Courier New", monospace;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444444;
    margin: 0 0 6px 0;
  }

  .room-label {
    font-size: 28px;
    font-weight: bold;
    margin: 0 0 6px 0;
    border-bottom: 3px solid #111111;
    display: inline-block;
    padding-bottom: 8px;
  }

  .date-label {
    font-family: "Courier New", monospace;
    font-size: 13px;
    color: #555555;
    margin: 0 0 16px 0;
  }

  .list {
    box-sizing: border-box;
    width: 100%;
    max-width: 620px;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }

  .item {
    box-sizing: border-box;
    flex: 0 0 calc(50% - 6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 3px solid #111111;
    padding: 12px 10px;
    background: #f6f6f4;
    cursor: pointer;
  }

  .item.checked {
    background: #111111;
  }

  .box {
    box-sizing: border-box;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border: 3px solid #111111;
    background: #ffffff;
    margin-bottom: 8px;
    position: relative;
  }

  .item.checked .box {
    background: #ffffff;
  }

  .box::after {
    content: "";
    display: none;
    position: absolute;
    left: 5px;
    top: 0px;
    width: 9px;
    height: 17px;
    border-right: 4px solid #111111;
    border-bottom: 4px solid #111111;
    transform: rotate(45deg);
  }

  .item.checked .box::after {
    display: block;
  }

  .item-text {
    text-align: center;
  }

  .med-name {
    font-size: 16px;
    font-weight: bold;
    margin: 0 0 2px 0;
  }

  .item.checked .med-name {
    color: #ffffff;
  }

  .med-dose {
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: #555555;
    margin: 0;
  }

  .item.checked .med-dose {
    color: #cccccc;
  }

  .footer-note {
    margin-top: 12px;
    font-family: "Courier New", monospace;
    font-size: 10px;
    color: #777777;
  }

  .reset-btn {
    margin-top: 14px;
    display: inline-block;
    border: 2px solid #111111;
    padding: 6px 16px;
    font-family: "Courier New", monospace;
    font-size: 11px;
    cursor: pointer;
    background: #ffffff;
  }
</style>
</head>
<body>

  <div class="frame">
    <p class="eyebrow">Registro diario</p>
    <h1 class="room-label">MEDICACIÓN</h1>
    <p class="date-label" id="dateLabel"></p>

    <div class="list" id="list">
      <!-- Los 4 medicamentos se generan desde el array MEDS más abajo -->
    </div>

    <div class="reset-btn" onclick="resetToday()">reiniciar día</div>
    <p class="footer-note">se reinicia automáticamente cada día</p>
  </div>

<script>
  // ============================================
  // EDITAR ACÁ: nombre y dosis de cada medicamento
  // ============================================
  var isSunday = new Date().getDay() === 0;
  var MEDS = [
    { id: "med1", name: "Levotiroxina", dose: isSunday ? "(T4) 100 mcg" : "(T4)50 mcg" },
    { id: "med2", name: "Lamotrigina", dose: "LAMIRAX 100 mg" },
    { id: "med3", name: "Metilfenidato", dose: "CONCENTRA 36 mg" },
    { id: "med4", name: "Carbonato de Litio", dose: "CEGLUTION-XR 900 mg" }
  ];
  // ============================================

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function loadState() {
    try {
      var raw = localStorage.getItem("med_" + todayKey());
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveState(state) {
    try {
      localStorage.setItem("med_" + todayKey(), JSON.stringify(state));
    } catch (e) {}
  }

  var state = loadState();

  function render() {
    var list = document.getElementById("list");
    list.innerHTML = "";
    MEDS.forEach(function (med) {
      var checked = !!state[med.id];
      var item = document.createElement("div");
      item.className = "item" + (checked ? " checked" : "");
      item.onclick = function () { toggle(med.id); };

      var box = document.createElement("div");
      box.className = "box";

      var text = document.createElement("div");
      text.className = "item-text";
      text.innerHTML =
        '<p class="med-name">' + med.name + '</p>' +
        '<p class="med-dose">' + med.dose + '</p>';

      item.appendChild(box);
      item.appendChild(text);
      list.appendChild(item);
    });
  }

  function toggle(id) {
    state[id] = !state[id];
    saveState(state);
    render();
  }

  function resetToday() {
    state = {};
    saveState(state);
    render();
  }

  function setDateLabel() {
    var d = new Date();
    var dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    var meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    document.getElementById("dateLabel").innerHTML =
      dias[d.getDay()] + " " + d.getDate() + " de " + meses[d.getMonth()];
  }

  setDateLabel();
  render();
</script>

</body>
</html>
